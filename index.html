    <style>
      /* Previne tela preta/branca durante inicialização */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #12100e;
        overflow-x: hidden;
      }

      /* Splash screen imediata estilo CapiHouse */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #12100e;
        z-index: 99999;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        user-select: none;
        -webkit-user-select: none;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .splash-logo-container {
        position: relative;
        margin-bottom: 20px;
      }

      .splash-logo {
        width: 88px;
        height: 88px;
        object-fit: contain;
        animation: splash-pulse 2s ease-in-out infinite alternate;
      }

      .splash-title {
        font-family: 'Space Mono', monospace;
        font-size: 26px;
        font-weight: 700;
        color: #f5efe6;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
      }

      .splash-subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #9e9185;
        margin: 0 0 28px 0;
        letter-spacing: 0.2px;
      }

      /* Barra de carregamento suave */
      .splash-loader-track {
        width: 120px;
        height: 4px;
        background-color: rgba(245, 197, 24, 0.15);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }

      .splash-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, #f5c518, #a66130);
        border-radius: 2px;
        animation: splash-loading 1.4s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0% { transform: scale(0.96); filter: drop-shadow(0 4px 12px rgba(245, 197, 24, 0.15)); }
        100% { transform: scale(1.02); filter: drop-shadow(0 10px 24px rgba(245, 197, 24, 0.35)); }
      }

      @keyframes splash-loading {
        0% { left: -40%; width: 30%; }
        50% { left: 35%; width: 45%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash">
        <div class="splash-content">
          <div class="splash-logo-container">
            <img src="/web-app-manifest-192x192.png" alt="CapyShowTime" class="splash-logo" width="88" height="88" />
          </div>
          <h1 class="splash-title">CapyShowTime</h1>
          <p class="splash-subtitle">O TV Show Time dos amigos da Capihouse</p>
          <div class="splash-loader-track">
            <div class="splash-loader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
